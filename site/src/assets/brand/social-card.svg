<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">bmux — The batteries-included multiplexer, built for coding agents.</title>
  <desc id="desc">Persistent sessions, a live session picker, git worktree grouping, an agent status sidebar, and modeless mouse selection over SSH in one static Go binary.</desc>
  <defs>
    <radialGradient id="glow" cx="72%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="right-fade" x1="1090" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" stop-opacity="0" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="1" />
    </linearGradient>
    <clipPath id="term-clip">
      <rect x="594" y="76" width="606" height="478" rx="12" />
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#09090b" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#27272a" />

  <!-- Left column -->
  <g transform="translate(64 72)">
    <line x1="12" y1="17" x2="34" y2="17" stroke="rgba(255,255,255,0.45)" stroke-width="2.2" />
    <rect x="0" y="0" width="34" height="34" rx="4" fill="none" stroke="#22d3ee" stroke-width="2.6" />
    <line x1="12" y1="0" x2="12" y2="34" stroke="#22d3ee" stroke-width="2.6" />
    <text x="46" y="27" fill="#fafafa" font-family="'Adwaita Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="29" font-weight="700">bmux</text>
    <rect x="132" y="4" width="194" height="27" rx="13.5" fill="#18181b" stroke="#27272a" />
    <text x="145" y="22" fill="#a1a1aa" font-family="'Adwaita Mono', 'JetBrains Mono', ui-monospace, monospace" font-size="13">Single Go binary · MIT</text>
  </g>

  <g transform="translate(64 188)" font-family="'Inter Display', 'Inter', system-ui, sans-serif" font-size="45" font-weight="700">
    <text x="0" y="0" fill="#fafafa">The batteries-included</text>
    <text x="0" y="56" fill="#fafafa">multiplexer, built for</text>
    <text x="0" y="112" fill="#22d3ee">coding agents.</text>
  </g>

  <g transform="translate(64 356)" fill="#a1a1aa" font-family="'Inter', system-ui, sans-serif" font-size="19">
    <text x="0" y="0">Live session picker · Git worktree grouping</text>
    <text x="0" y="30">Agent sidebar · Modeless mouse copy over SSH</text>
  </g>

  <g transform="translate(64 424)" font-family="'Adwaita Mono', ui-monospace, monospace" font-size="14">
    <rect x="0" y="0" width="118" height="32" rx="8" fill="#18181b" stroke="#27272a" />
    <text x="12" y="21"><tspan fill="#22d3ee" font-weight="700">1.5 ms</tspan><tspan dx="6" fill="#d4d4d8">echo</tspan></text>
    <rect x="128" y="0" width="192" height="32" rx="8" fill="#18181b" stroke="#27272a" />
    <text x="140" y="21"><tspan fill="#22d3ee" font-weight="700">200k</tspan><tspan dx="6" fill="#d4d4d8">lines / 0.06 s</tspan></text>
    <rect x="330" y="0" width="104" height="32" rx="8" fill="#18181b" stroke="#27272a" />
    <text x="342" y="21"><tspan fill="#22d3ee" font-weight="700">0 Hz</tspan><tspan dx="6" fill="#d4d4d8">idle</tspan></text>
  </g>

  <line x1="64" y1="504" x2="552" y2="504" stroke="#27272a" />
  <text x="64" y="540" font-family="'Adwaita Mono', ui-monospace, monospace" font-size="15">
    <tspan fill="#e4e4e7" font-weight="700">bmux-dev.github.io/bmux</tspan>
    <tspan fill="#71717a">  ·  macOS &amp; Linux</tspan>
  </text>

  <!-- Right column: One Dark terminal UI -->
  <g clip-path="url(#term-clip)" font-family="'Adwaita Mono', 'JetBrains Mono', ui-monospace, monospace">
    <!-- Terminal background -->
    <rect x="594" y="76" width="606" height="478" fill="#282c34" />

    <!-- macOS-style titlebar -->
    <rect x="594" y="76" width="606" height="26" fill="#21252b" />
    <circle cx="610" cy="89" r="4.5" fill="#e06c75" />
    <circle cx="624" cy="89" r="4.5" fill="#e5c07b" />
    <circle cx="638" cy="89" r="4.5" fill="#98c379" />
    <text x="900" y="93" text-anchor="middle" fill="#abb2bf" font-size="11.5" font-weight="600">bmux</text>

    <!-- Top powerline status bar -->
    <rect x="594" y="102" width="606" height="20" fill="#2c313c" />
    <rect x="606" y="104" width="74" height="16" fill="#61afef" />
    <polygon points="680,104 686,112 680,120" fill="#61afef" />
    <text x="613" y="116" fill="#1e222a" font-size="10.5" font-weight="700">bmux@dev</text>
    <text x="694" y="116" fill="#abb2bf" font-size="10.5">api</text>
    <text x="726" y="116" fill="#7f848e" font-size="10.5">pane 2/2</text>
    <rect x="794" y="104" width="54" height="16" fill="#61afef" />
    <polygon points="848,104 854,112 848,120" fill="#61afef" />
    <text x="802" y="116" fill="#1e222a" font-size="10.5" font-weight="700">1 dev!</text>

    <!-- Sidebar -->
    <rect x="594" y="122" width="180" height="410" fill="#21252b" />
    <line x1="774" y1="122" x2="774" y2="532" stroke="#3b4048" stroke-width="1" />

    <text x="606" y="140" fill="#7f848e" font-size="10.5" font-weight="700">SESSIONS</text>
    <rect x="598" y="146" width="172" height="18" rx="3" fill="#2c313c" />
    <circle cx="611" cy="155" r="3" fill="#e06c75" />
    <text x="621" y="159" fill="#abb2bf" font-size="11" font-weight="700">api</text>
    <text x="764" y="159" text-anchor="end" fill="#7f848e" font-size="10.5">main</text>

    <text x="613" y="177" fill="#5c6370" font-size="11">└</text>
    <circle cx="625" cy="173" r="3" fill="#e06c75" />
    <text x="633" y="177" fill="#abb2bf" font-size="10.5">api-auth</text>
    <text x="764" y="177" text-anchor="end" fill="#7f848e" font-size="10">fix/auth</text>

    <circle cx="611" cy="192" r="3" fill="#e06c75" />
    <text x="621" y="196" fill="#abb2bf" font-size="11">web</text>

    <circle cx="611" cy="211" r="3" fill="none" stroke="#98c379" stroke-width="1.4" />
    <text x="621" y="215" fill="#7f848e" font-size="11">docs</text>

    <line x1="604" y1="228" x2="766" y2="228" stroke="#3b4048" stroke-width="1" />
    <text x="606" y="246" fill="#7f848e" font-size="10.5" font-weight="700">AGENTS 5</text>

    <circle cx="611" cy="265" r="3" fill="#e5c07b" />
    <text x="621" y="269" fill="#abb2bf" font-size="11">Claude</text>
    <text x="764" y="269" text-anchor="end" fill="#e5c07b" font-size="10.5">working</text>
    <text x="621" y="283" fill="#5c6370" font-size="10">api</text>

    <circle cx="611" cy="303" r="3" fill="#e06c75" />
    <text x="621" y="307" fill="#abb2bf" font-size="11">Codex</text>
    <text x="764" y="307" text-anchor="end" fill="#e06c75" font-size="10.5">blocked</text>
    <text x="621" y="321" fill="#5c6370" font-size="10">api</text>

    <circle cx="611" cy="341" r="3" fill="#e06c75" />
    <text x="621" y="345" fill="#abb2bf" font-size="11">Claude</text>
    <text x="764" y="345" text-anchor="end" fill="#e06c75" font-size="10.5">blocked</text>
    <text x="621" y="359" fill="#5c6370" font-size="10">api-auth</text>

    <circle cx="611" cy="379" r="3" fill="#e06c75" />
    <text x="621" y="383" fill="#abb2bf" font-size="11">Codex</text>
    <text x="764" y="383" text-anchor="end" fill="#e06c75" font-size="10.5">blocked</text>
    <text x="621" y="397" fill="#5c6370" font-size="10">web</text>

    <circle cx="611" cy="417" r="3" fill="none" stroke="#98c379" stroke-width="1.4" />
    <text x="621" y="421" fill="#abb2bf" font-size="11">OpenCode</text>
    <text x="764" y="421" text-anchor="end" fill="#7f848e" font-size="10.5">idle</text>
    <text x="621" y="435" fill="#5c6370" font-size="10">docs</text>

    <!-- Middle pane (Claude Code) -->
    <text x="786" y="140" fill="#abb2bf" font-size="11" font-weight="600">Claude</text>
    <text x="832" y="140" fill="#5c6370" font-size="11">· ~/projects/api</text>
    <text x="786" y="172" fill="#abb2bf" font-size="11"><tspan fill="#5c6370">&gt;</tspan><tspan dx="5">Add a /health endpoint</tspan></text>
    <circle cx="791" cy="204" r="2.8" fill="#98c379" />
    <text x="802" y="208" fill="#abb2bf" font-size="11">Read router.go</text>
    <circle cx="791" cy="226" r="2.8" fill="#98c379" />
    <text x="802" y="230" fill="#abb2bf" font-size="11">Edited health.go (+42)</text>
    <circle cx="791" cy="248" r="2.8" fill="#98c379" />
    <text x="802" y="252" fill="#abb2bf" font-size="11">Running go vet ./...</text>
    <text x="786" y="284" font-size="11"><tspan fill="#e5c07b">⠒ Working</tspan><tspan dx="5" fill="#5c6370">(18s · esc)</tspan></text>

    <!-- Active pane divider -->
    <line x1="1040" y1="122" x2="1040" y2="532" stroke="#61afef" stroke-width="1.5" />

    <!-- Right pane (Codex approval prompt) -->
    <text x="1052" y="140" fill="#abb2bf" font-size="11" font-weight="600">Codex</text>
    <text x="1092" y="140" fill="#5c6370" font-size="11">· ~/projects/api</text>
    <text x="1052" y="172" fill="#abb2bf" font-size="11"><tspan fill="#5c6370">&gt;</tspan><tspan dx="5">Run server tests</tspan></text>
    <circle cx="1057" cy="204" r="2.8" fill="#98c379" />
    <text x="1068" y="208" fill="#abb2bf" font-size="11">Ran go build ./...</text>
    <circle cx="1057" cy="226" r="2.8" fill="#e5c07b" />
    <text x="1068" y="230" fill="#abb2bf" font-size="11">Wants go test ./...</text>
    <text x="1052" y="266" fill="#e06c75" font-size="11" font-weight="600">Allow this command?</text>
    <text x="1060" y="288" fill="#56b6c2" font-size="11">&gt; 1. Yes</text>
    <text x="1060" y="308" fill="#abb2bf" font-size="11">  2. Yes, don't ask</text>
    <text x="1060" y="328" fill="#7f848e" font-size="11">  3. No, tell Codex</text>

    <!-- Bottom status line -->
    <rect x="594" y="532" width="606" height="22" fill="#21252b" />
    <text x="606" y="547" fill="#7f848e" font-size="10.5">api  |  pane 2/2 · right  |  Ctrl-a s sessions  ·  Ctrl-h/j/k/l navigate</text>

    <!-- Terminal outer border (fades cleanly at right edge) -->
    <rect x="594.75" y="76.75" width="606" height="476.5" rx="12" fill="none" stroke="#3f3f46" stroke-width="1.5" />

    <!-- Subtle right-edge fade -->
    <rect x="1090" y="76" width="110" height="478" fill="url(#right-fade)" />
  </g>
</svg>
