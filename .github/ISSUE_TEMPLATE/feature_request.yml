name: Feature request
description: Propose a new capability or improvement for bmux
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow gap or limitation does this address?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: Proposed behavior, UX, or configuration surface.
    validations:
      required: true
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: Clear acceptance criteria and test/doc expectations.
    validations:
      required: true
